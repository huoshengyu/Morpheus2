/$(var robot_name):
  controller_manager:
    ros__parameters:
      update_rate: 100 # Hz

      arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      gripper_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      # Cartesian controllers
      # https://github.com/fzi-forschungszentrum-informatik/cartesian_controllers
      cartesian_compliance_controller:
        type: cartesian_compliance_controller/CartesianComplianceController

      cartesian_force_controller:
        type: cartesian_force_controller/CartesianForceController

      cartesian_motion_controller:
        type: cartesian_motion_controller/CartesianMotionController

      motion_control_handle:
        type: cartesian_controller_handles/MotionControlHandle

  arm_controller:
    ros__parameters:
      joints:
        - waist
        - shoulder
        - elbow
        - forearm_roll
        - wrist_angle
        - wrist_rotate
      command_interfaces:
        - position
      state_interfaces:
        - position
      state_publish_rate: 50.0 # Hz
      action_monitor_rate: 20.0 # Hz
      constraints:
        stopped_velocity_tolerance: 0.02
        goal_time: 1.0

  gripper_controller:
    ros__parameters:
      joints:
        - left_finger
      command_interfaces:
        - position
      state_interfaces:
        - position

  joint_state_broadcaster:
    ros__parameters:
      joints:
        - waist
        - shoulder
        - elbow
        - forearm_roll
        - wrist_angle
        - wrist_rotate
        - gripper
        - left_finger

  # Cartesian controllers
  # https://github.com/fzi-forschungszentrum-informatik/cartesian_controllers
  cartesian_compliance_controller:
    ros__parameters:
      end_effector_link: $(var robot_name)/ee_gripper_link
      robot_base_link: $(var robot_name)/base_link
      ft_sensor_ref_link: $(var robot_name)/ee_gripper_link
      compliance_ref_link: $(var robot_name)/ee_gripper_link
      joints:
        - waist
        - shoulder
        - elbow
        - forearm_roll
        - wrist_angle
        - wrist_rotate

      # Choose: position or velocity.
      command_interfaces:
        - position
        #- velocity

      stiffness:  # w.r.t. compliance_ref_link
          trans_x: 500.0
          trans_y: 500.0
          trans_z: 500.0
          rot_x: 20.0
          rot_y: 20.0
          rot_z: 20.0

      solver:
          error_scale: 0.5
          iterations: 10

      pd_gains:
          trans_x: {p: 0.05, d: 0.005}
          trans_y: {p: 0.05, d: 0.005}
          trans_z: {p: 0.05, d: 0.005}
          rot_x: {p: 1.5}
          rot_y: {p: 1.5}
          rot_z: {p: 1.5}

  cartesian_force_controller:
    ros__parameters:

      # See the cartesian_compliance_controller
      end_effector_link: $(var robot_name)/ee_gripper_link
      robot_base_link: $(var robot_name)/base_link
      ft_sensor_ref_link: $(var robot_name)/ee_gripper_link
      joints:
        - waist
        - shoulder
        - elbow
        - forearm_roll
        - wrist_angle
        - wrist_rotate

      # See the cartesian_compliance_controller
      command_interfaces:
        - position
          #- velocity

      solver:
          error_scale: 0.5
          publish_state_feedback: True

      pd_gains:
          trans_x: {p: 0.05}
          trans_y: {p: 0.05}
          trans_z: {p: 0.05}
          rot_x: {p: 1.5}
          rot_y: {p: 1.5}
          rot_z: {p: 1.5}

  cartesian_motion_controller:
    ros__parameters:

      # See the cartesian_compliance_controller
      end_effector_link: $(var robot_name)/ee_gripper_link
      robot_base_link: $(var robot_name)/base_link
      joints:
        - waist
        - shoulder
        - elbow
        - forearm_roll
        - wrist_angle
        - wrist_rotate

      # See the cartesian_compliance_controller
      command_interfaces:
        - position
        #- velocity

      solver:
          error_scale: 1.0
          iterations: 10
          publish_state_feedback: True

      pd_gains:
          trans_x: {p: 1.0}
          trans_y: {p: 1.0}
          trans_z: {p: 1.0}
          rot_x: {p: 0.5}
          rot_y: {p: 0.5}
          rot_z: {p: 0.5}

  motion_control_handle:
    ros__parameters:
      end_effector_link: $(var robot_name)/ee_gripper_link
      robot_base_link: $(var robot_name)/base_link
      ft_sensor_ref_link: $(var robot_name)/ee_gripper_link
      joints:
        - waist
        - shoulder
        - elbow
        - forearm_roll
        - wrist_angle
        - wrist_rotate