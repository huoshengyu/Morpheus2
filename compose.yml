# Portable baseline. Add a platform override for display mounts and host networking.
services:
  morpheus2:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bash", "-lc", "source /opt/ros/${ROS_DISTRO:-jazzy}/setup.bash && tail -F /dev/null"]
    init: true

    # Realtime scheduling requires host-kernel support; these settings alone
    # do not make a standard Linux or WSL kernel a realtime kernel.
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1

    environment:
      DISPLAY: ${DISPLAY:-}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-}
      XAUTHORITY: ${XAUTHORITY:-/tmp/.Xauthority}
      QT_X11_NO_MITSHM: "1"
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      RCUTILS_COLORIZED_OUTPUT: "1"
      GZ_VERSION: harmonic
      NVIDIA_DRIVER_CAPABILITIES: all
      __GLX_VENDOR_LIBRARY_NAME: nvidia

    volumes:
      - .:/root/ros2_ws/src

    # Compose GPU reservation; configure NVIDIA GPU support on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Add host networking only on platforms where its behavior is suitable.
